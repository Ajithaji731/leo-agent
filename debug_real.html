<!DOCTYPE html>
<html>
<head><title>Debug</title></head>
<body>
<script src="js/app_v2.js"></script>
<script>
// We can override fetch to see exactly what is being sent!
const originalFetch = window.fetch;
window.fetch = async function(...args) {
    console.log("FETCH CALL:", args[0]);
    if (args[1] && args[1].body) {
        console.log("FETCH BODY:", args[1].body);
    }
    const res = await originalFetch(...args);
    const clone = res.clone();
    clone.text().then(text => console.log("FETCH RESPONSE:", text));
    return res;
};
</script>
</body>
</html>
