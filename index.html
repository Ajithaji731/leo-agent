<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Agent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Leo - Personal AI Agent</title>
  <link rel="stylesheet" href="styles.css?v=20261126_v6">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Chat Screen -->
  <div id="chatScreen" class="chat-screen">
    <header class="glass-panel">
      <div class="header-content">
        <div class="logo">
          <span style="font-size: 1.5rem;">🦁</span>
          <h1>Leo</h1>
        </div>
        
        <div style="display: flex; gap: 8px; align-items: center;">
          <button id="openMonthlyUpdateBtn" class="header-action-pill" title="Monthly Investment Update Template">
            <i data-lucide="calendar-check"></i>
            <span>Monthly Update</span>
          </button>
          <div id="apiKeyBadge" class="key-badge" title="Groq API Key valid until Aug 20, 2027">
            <i data-lucide="key"></i>
            <span>API Key: Valid till Aug 2027</span>
          </div>
          <select id="theme-selector" style="background: rgba(255,255,255,0.1); color: inherit; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 4px 8px; font-family: inherit; font-size: 0.85rem; outline: none; cursor: pointer;">
            <option value="default" style="background: #111827;">Default Dark</option>
            <option value="alt-dark" style="background: #000;">OLED Dark</option>
            <option value="light" style="background: #fff; color: #000;">Light Theme</option>
          </select>
          <button id="clearHistoryBtn" class="icon-btn" aria-label="Clear History" title="Clear Chat History">
            <i data-lucide="trash-2"></i>
          </button>
        </div>
      </div>
    </header>

    <div id="chatContainer" class="chat-container">
      <!-- Chat messages will be injected here -->
      <div class="message ai-message">
        <div class="message-content glass-panel">
          Hi Ajith! Leo here. 🦁 I can help you track your habits and log your investments. What did you do today?
        </div>
      </div>
    </div>

    <div class="input-area glass-panel">
      <div class="quick-chips-container" id="quickChipsContainer">
        <button type="button" class="chip-btn" data-query="what all i did today">
          <span>📅</span> What all I did today
        </button>
        <button type="button" class="chip-btn" data-query="today expenses">
          <span>💸</span> Today's expenses
        </button>
        <button type="button" class="chip-btn" data-query="spent 20 for tea">
          <span>☕</span> Spent 20 for tea
        </button>
        <button type="button" class="chip-btn" data-query="total networth">
          <span>💰</span> Total networth
        </button>
        <button type="button" class="chip-btn" data-query="what is pending">
          <span>⏳</span> Pending habits
        </button>
        <button type="button" class="chip-btn" data-query="weekly summary">
          <span>📊</span> Weekly summary
        </button>
        <button type="button" class="chip-btn" data-query="stocks">
          <span>📈</span> Stocks & ETFs
        </button>
        <button type="button" class="chip-btn" data-query="mutual funds">
          <span>🏦</span> Mutual funds
        </button>
      </div>

      <form id="chatForm">
        <input type="text" id="chatInput" placeholder="Message Leo..." autocomplete="off">
        <button type="submit" id="sendBtn" class="icon-btn primary-btn" aria-label="Send">
          <i data-lucide="send"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Slide-out Sidebar Drawer: Monthly Investment Update -->
  <div id="monthlySidebarOverlay" class="sidebar-overlay">
    <div id="monthlySidebar" class="sidebar-drawer glass-panel">
      
      <div class="sidebar-header">
        <div class="sidebar-title-group">
          <span class="sidebar-icon">📊</span>
          <div>
            <h3>Monthly Investments</h3>
            <p class="sidebar-subtitle">Quick update for Wealthflow</p>
          </div>
        </div>
        <button id="closeMonthlySidebarBtn" class="sidebar-close-btn" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="sidebar-content">
        <!-- Target Month & Year -->
        <div class="sidebar-section">
          <div class="date-select-row">
            <div class="date-select-col">
              <label for="templateMonthSelect" class="sidebar-label">Select Month:</label>
              <select id="templateMonthSelect" class="sidebar-select">
                <option value="December" selected>December</option>
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
              </select>
            </div>
            <div class="date-select-col date-select-col-year">
              <label for="templateYearSelect" class="sidebar-label">Select Year:</label>
              <select id="templateYearSelect" class="sidebar-select">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Assets from Wealthflow -->
        <div class="sidebar-section">
          <div class="section-heading-row">
            <label class="sidebar-label">Wealthflow Holdings & SIPs:</label>
            <span class="total-badge" id="sidebarTotalAmount">Total: ₹0</span>
          </div>
          
          <div class="sidebar-category-tabs" id="sidebarCategoryTabs">
            <button type="button" class="sidebar-cat-pill active" data-filter="all">All</button>
            <button type="button" class="sidebar-cat-pill" data-filter="stocks">Stocks & ETFs</button>
            <button type="button" class="sidebar-cat-pill" data-filter="mutual">Mutual Funds</button>
            <button type="button" class="sidebar-cat-pill" data-filter="savings">Savings & Goals</button>
          </div>

          <div class="asset-inputs-list" id="assetInputsList">
            <!-- Dynamically populated from Wealthflow assets -->
          </div>
        </div>

        <!-- Live Generated Prompt Box -->
        <div class="sidebar-section">
          <div class="section-heading-row">
            <label class="sidebar-label">Generated Prompt for Leo:</label>
            <span class="ready-badge">Ready to Copy</span>
          </div>
          <textarea id="monthlyPromptOutput" class="prompt-preview-textarea" readonly rows="4" placeholder="Select month and enter amounts above..."></textarea>
        </div>
      </div>

      <!-- Sidebar Footer Actions -->
      <div class="sidebar-footer">
        <button type="button" id="copyPromptBtn" class="sidebar-btn primary-btn">
          <i data-lucide="copy"></i>
          <span>Copy Prompt</span>
        </button>
        <button type="button" id="sendPromptBtn" class="sidebar-btn send-btn">
          <i data-lucide="send"></i>
          <span>Send to Leo</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden">
    <i data-lucide="check-circle" class="toast-icon"></i>
    <span id="toastMsg">Success</span>
  </div>

  <script src="js/app_v3.js?v=20261126_v8"></script>
</body>
</html>
