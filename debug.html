<!DOCTYPE html>
<html>
<body>
<script>
const HABIT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwsawPKIh-cdc3pE_S1eybL0CYimovUhC3N5JEQrojXt4XPOuFJHt4JJvyMnnQROWQR/exec';
const SECURE_ID = '2108';

async function runTest() {
    try {
        const url = `${HABIT_GAS_URL}?userId=${SECURE_ID}&t=${Date.now()}`;
        console.log("Fetching:", url);
        const res = await fetch(url);
        const text = await res.text();
        console.log("Raw Response:", text);
        
        let habits = JSON.parse(text);
        console.log("Parsed habits:", habits);
        console.log("Is Array?", Array.isArray(habits));
        
        document.body.innerHTML = "<h1>Check Console</h1><pre>" + text + "</pre>";
    } catch(e) {
        console.error(e);
        document.body.innerHTML = "<h1>Error</h1><pre>" + e.toString() + "</pre>";
    }
}
runTest();
</script>
</body>
</html>
